name: Publish Daily Run Seed

on:
  schedule:
    # Retry through the first three UTC hours. GitHub schedules can be delayed,
    # and the official API is occasionally protected by a transient 403/5xx.
    - cron: "15,45 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-daily-run-seed
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out this fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch the authoritative seed
        env:
          SEED_API_URL: https://api.pokerogue.net/daily/seed
        run: |
          set -euo pipefail

          seed=""
          source="pokerogue-api"
          client_version="$(sed -nE 's/^export const UPSTREAM_VERSION = "([^"]+)";/\1/p' switch/scripts/config.mjs)"
          if [[ -z "$client_version" ]]; then
            echo "Could not read the pinned PokeRogue client version." >&2
            exit 1
          fi
          # The Ubuntu runner includes matching Chrome and ChromeDriver.
          # Fetching from a real pokerogue.net page gives the API the same
          # first-party browser context as the official game, without using
          # Scooom's server, another mirror, or any third-party proxy.
          echo "Fetching the official seed from a first-party pokerogue.net browser context."
          if candidate="$(POKEROGUE_CLIENT_VERSION="$client_version" node scripts/fetch-official-daily-seed.js)"; then
            candidate="$(printf '%s' "$candidate" | tr -d '\r\n')"
            if [[ -n "$candidate" && ${#candidate} -le 131072 && "$candidate" =~ ^[A-Za-z0-9+/=_-]+$ ]]; then
              seed="$candidate"
            fi
          fi

          # Retain one lightweight exact-client request as a fallback in case
          # a future runner image temporarily lacks a working browser driver.
          if [[ -z "$seed" ]]; then
            echo "Browser fetch failed; trying the official API directly once."
            if candidate="$(curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Accept: text/plain" \
              --header "Authorization;" \
              --header "Content-Type: application/json" \
              --header "Origin: https://pokerogue.net" \
              --header "PKR-Client-Version: $client_version" \
              --header "Referer: https://pokerogue.net/" \
              "$SEED_API_URL")"; then
              candidate="$(printf '%s' "$candidate" | tr -d '\r\n')"
              if [[ -n "$candidate" && ${#candidate} -le 131072 && "$candidate" =~ ^[A-Za-z0-9+/=_-]+$ ]]; then
                seed="$candidate"
              fi
            fi
          fi

          if [[ -z "$seed" ]]; then
            # Publish the same deterministic fallback used by the offline app,
            # but mark it non-authoritative so clients do not cache it all day.
            source="offline-fallback"
            seed="$(printf '%s' "$(date -u +%F)" | base64 -w0)"
            echo "::warning::Official seed remained unavailable; publishing a non-cacheable offline fallback."
          fi

          jq --null-input \
            --arg date "$(date -u +%F)" \
            --arg seed "$seed" \
            --arg source "$source" \
            '{date: $date, seed: $seed, source: $source}' \
            > "$RUNNER_TEMP/daily-seed.json"

          jq -e '
            (.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
            and (.seed | type == "string" and length > 0)
            and (.source == "pokerogue-api" or .source == "offline-fallback")
          ' "$RUNNER_TEMP/daily-seed.json" >/dev/null

      - name: Publish to this fork's seed branch
        env:
          PUBLISHED_SEED: ${{ runner.temp }}/daily-seed.json
        run: |
          set -euo pipefail

          publish_parent="$(mktemp -d)"
          publish_dir="$publish_parent/seed"
          trap 'git worktree remove --force "$publish_dir" >/dev/null 2>&1 || true; rm -rf "$publish_parent"' EXIT

          if git ls-remote --exit-code --heads origin seed >/dev/null 2>&1; then
            git fetch origin seed
            git worktree add --force -B seed "$publish_dir" origin/seed
          else
            git worktree add --detach "$publish_dir"
            # `git switch --orphan` clears the index and worktree itself.
            # A subsequent `git rm .` fails with exit 128 because nothing is
            # tracked yet, which previously broke the first publication.
            git -C "$publish_dir" switch --orphan seed
          fi

          mkdir -p "$publish_dir/docs"
          cp "$PUBLISHED_SEED" "$publish_dir/docs/daily-seed.json"

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add docs/daily-seed.json

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "The published Daily Run seed is already current."
            exit 0
          fi

          git -C "$publish_dir" commit -m "chore: publish Daily Run seed"
          git -C "$publish_dir" push origin HEAD:seed
