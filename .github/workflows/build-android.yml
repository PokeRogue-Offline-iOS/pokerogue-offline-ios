name: Build PokeRogueOffline APK

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (dev OAuth config/icon/app id, no Drive backup wiring)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

env:
  SILVERSHADOW_VERSION: '1.0.2'
  
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Clone PokeRogue
        run: |
          git clone \
            --recurse-submodules \
            --shallow-submodules \
            --depth 1 \
            --branch "${{ inputs.branch || 'main' }}" \
            https://github.com/pagefaultgames/pokerogue.git \
            pokerogue-src

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: false
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - name: Get PokeRogue version
        id: pokerogue_version
        run: |
          VERSION=$(node -p "require('./pokerogue-src/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Apply patches
        run: |
          bash "${{ github.workspace }}/scripts/apply-patches.sh" android

      - name: Inject SilverShadow version into banner
        run: |
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          SILVER_VERSION="${{ env.SILVERSHADOW_VERSION }}"
          BANNER_FILE="pokerogue-src/src/ui/handlers/title-ui-handler.ts"

          sed -i \
            "s|SILVERSHADOW_VERSION_PLACEHOLDER|${SILVER_VERSION}|g" \
            "$BANNER_FILE"

          if [ "${{ inputs.dev }}" = "true" ]; then
            sed -i \
              "s|BUILD_NUMBER_PLACEHOLDER|${BUILD_NUM} DEV|g" \
              "$BANNER_FILE"
          else
            sed -i \
              "s|BUILD_NUMBER_PLACEHOLDER|${BUILD_NUM}|g" \
              "$BANNER_FILE"
          fi

          if grep -q "PLACEHOLDER" "$BANNER_FILE"; then
            echo "::error::An unresolved banner placeholder remains."
            grep "PLACEHOLDER" "$BANNER_FILE"
            exit 1
          fi

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm package cache
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-node24-silver-android-v1-${{ hashFiles('pokerogue-src/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-node24-silver-android-v1-
            ${{ runner.os }}-pnpm-node24-

      - name: Add Capacitor dependencies to lockfile
        working-directory: pokerogue-src
        run: |
          pnpm add \
            --lockfile-only \
            --save-exact \
            @capacitor/core@8.4.1 \
            @capacitor/cli@8.4.1 \
            @capacitor/android@8.4.1 \
            @capacitor/app@8.1.1 \
            @capacitor/filesystem@8.1.2 \
            @capacitor/share@8.0.1 \
            @capacitor/status-bar@8.0.2

      - name: Install all JavaScript dependencies
        working-directory: pokerogue-src
        run: |
          pnpm install \
            --frozen-lockfile \
            --prefer-offline \
            --reporter=append-only

      - name: Save pnpm package cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Configure Capacitor
        working-directory: pokerogue-src
        run: |
          if [ "${{ inputs.dev }}" = "true" ]; then
            cp ${{ github.workspace }}/configs/android/capacitor/capacitor.config-dev.json capacitor.config.json
          else
            cp ${{ github.workspace }}/configs/android/capacitor/capacitor.config.json capacitor.config.json
          fi

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build:app

      - name: Apply post-build patches
        run: bash ${{ github.workspace }}/scripts/apply-post-build-patches.sh android
        
      - name: Add Android platform
        working-directory: pokerogue-src
        run: pnpm exec cap add android

      - name: Sync Capacitor
        working-directory: pokerogue-src
        run: pnpm exec cap sync android

      - name: Add AndroidX WebKit dependency
        working-directory: pokerogue-src
        run: |
          APP_GRADLE="android/app/build.gradle"

          if ! grep -q 'androidx.webkit:webkit' "$APP_GRADLE"; then
            sed -i \
              '/^dependencies {/a\    implementation "androidx.webkit:webkit:1.14.0"' \
              "$APP_GRADLE"
          fi

          echo "AndroidX WebKit dependency:"
          grep 'androidx.webkit:webkit' "$APP_GRADLE"        

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Configure Gradle performance
        run: |
          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.daemon=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

      - name: Copy static MainActivity
        working-directory: pokerogue-src
        run: |
          DEST=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          cp ${{ github.workspace }}/configs/android/java/MainActivity.java "$DEST"
          if [ "${{ inputs.dev }}" = "true" ]; then
            sed -i "s/^package com.silvershadow.pkr;/package com.silvershadow.pkrdev;/" "$DEST"
          fi

      - name: Patch AndroidManifest to prevent keyboard resize
        working-directory: pokerogue-src
        run: node ${{ github.workspace }}/patches/android/node/android-manifest-keyboard-fix.js

      - name: Fix Android permissions
        working-directory: pokerogue-src
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "WRITE_EXTERNAL_STORAGE" $MANIFEST || \
            sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <application|' $MANIFEST
          echo "Contents of ${MANIFEST}"
          cat $MANIFEST

      - name: Generate SilverShadow Android icons
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends imagemagick
          fi

          if [ "${{ inputs.dev }}" = "true" ]; then
            ICON_SRC="${{ github.workspace }}/configs/android/icon-dev.png"
          else
            ICON_SRC="${{ github.workspace }}/configs/android/icon-main.png"
          fi

          if [ ! -f "$ICON_SRC" ]; then
            echo "::error::Launcher icon not found: $ICON_SRC"
            exit 1
          fi

          RES_DIR="pokerogue-src/android/app/src/main/res"
          MANIFEST="pokerogue-src/android/app/src/main/AndroidManifest.xml"

          # Remove every generated/upstream launcher image so no stale
          # PokéRogue launcher resource can be packaged accidentally.
          find "$RES_DIR" -type f \
            \( \
              -name 'ic_launcher.*' \
              -o -name 'ic_launcher_round.*' \
              -o -name 'ic_launcher_foreground.*' \
              -o -name 'silvershadow_launcher.*' \
              -o -name 'silvershadow_launcher_round.*' \
              -o -name 'silvershadow_launcher_foreground.*' \
            \) \
            -delete

          # density:legacy-size:adaptive-canvas:safe-logo-size
          ICON_SIZES=(
            "mdpi:48:108:66"
            "hdpi:72:162:99"
            "xhdpi:96:216:132"
            "xxhdpi:144:324:198"
            "xxxhdpi:192:432:264"
          )

          for ICON_ENTRY in "${ICON_SIZES[@]}"; do
            IFS=: read -r DENSITY LEGACY_SIZE ADAPTIVE_SIZE SAFE_SIZE \
              <<< "$ICON_ENTRY"

            DEST_DIR="$RES_DIR/mipmap-$DENSITY"
            mkdir -p "$DEST_DIR"

            # Legacy icon used by older Android versions and some APK viewers.
            convert "$ICON_SRC" \
              -strip \
              -filter Lanczos \
              -resize "${LEGACY_SIZE}x${LEGACY_SIZE}!" \
              "$DEST_DIR/silvershadow_launcher.png"

            cp \
              "$DEST_DIR/silvershadow_launcher.png" \
              "$DEST_DIR/silvershadow_launcher_round.png"

            # Also replace the conventional names for splash screens,
            # launchers, or libraries that still reference ic_launcher.
            cp \
              "$DEST_DIR/silvershadow_launcher.png" \
              "$DEST_DIR/ic_launcher.png"

            cp \
              "$DEST_DIR/silvershadow_launcher.png" \
              "$DEST_DIR/ic_launcher_round.png"

            # Adaptive foreground. The complete design is reduced into the
            # safe region so PR, SS, DEV, and the Poké Ball remain visible.
            convert "$ICON_SRC" \
              -strip \
              -filter Lanczos \
              -resize "${SAFE_SIZE}x${SAFE_SIZE}!" \
              -gravity center \
              -background none \
              -extent "${ADAPTIVE_SIZE}x${ADAPTIVE_SIZE}" \
              "$DEST_DIR/silvershadow_launcher_foreground.png"

            cp \
              "$DEST_DIR/silvershadow_launcher_foreground.png" \
              "$DEST_DIR/ic_launcher_foreground.png"
          done

          mkdir -p "$RES_DIR/mipmap-anydpi-v26"

          cat > \
            "$RES_DIR/mipmap-anydpi-v26/silvershadow_launcher.xml" \
            <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@mipmap/silvershadow_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp \
            "$RES_DIR/mipmap-anydpi-v26/silvershadow_launcher.xml" \
            "$RES_DIR/mipmap-anydpi-v26/silvershadow_launcher_round.xml"

          # Keep conventional adaptive-resource names custom as well.
          cat > \
            "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" \
            <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp \
            "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" \
            "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"

          # Force the APK manifest to use the unique SilverShadow resource.
          python - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path(
              "pokerogue-src/android/app/src/main/AndroidManifest.xml"
          )
          source = manifest_path.read_text(encoding="utf-8")

          match = re.search(r"<application\b[^>]*>", source, re.DOTALL)

          if not match:
              raise SystemExit(
                  "Could not find the <application> tag in AndroidManifest.xml"
              )

          application = match.group(0)

          def set_attribute(tag: str, name: str, value: str) -> str:
              pattern = rf'{re.escape(name)}="[^"]*"'

              if re.search(pattern, tag):
                  return re.sub(
                      pattern,
                      f'{name}="{value}"',
                      tag,
                      count=1,
                  )

              return tag.replace(
                  "<application",
                  f'<application\n        {name}="{value}"',
                  1,
              )

          application = set_attribute(
              application,
              "android:icon",
              "@mipmap/silvershadow_launcher",
          )

          application = set_attribute(
              application,
              "android:roundIcon",
              "@mipmap/silvershadow_launcher_round",
          )

          source = (
              source[:match.start()]
              + application
              + source[match.end():]
          )

          manifest_path.write_text(source, encoding="utf-8")
          PY

          echo "Icon source:"
          identify "$ICON_SRC"

          echo "Manifest icon references:"
          grep -E 'android:(icon|roundIcon)=' "$MANIFEST"

          echo "Generated SilverShadow resources:"
          find "$RES_DIR" \
            -type f \
            -name 'silvershadow_launcher*' \
            -print \
            | sort
            
      - name: Set version in build.gradle
        working-directory: pokerogue-src/android/app
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          VERSION="${{ steps.pokerogue_version.outputs.version }}"

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          HOTFIX=$(echo "$VERSION" | cut -d. -f4)

          VERSION_CODE=$(( MINOR * 100000000 + PATCH * 1000000 + HOTFIX * 10000 + BUILD_NUM ))
          SILVER_VERSION="${{ env.SILVERSHADOW_VERSION }}"
          VERSION_NAME="${VERSION}.${BUILD_NUM}-${SILVER_VERSION}"

          if [ "${{ inputs.dev }}" = "true" ]; then
            VERSION_NAME="${VERSION_NAME}-dev"
          fi

          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" build.gradle

      - name: Make gradlew executable
        working-directory: pokerogue-src/android
        run: chmod +x gradlew

      - name: Restore pinned debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build Android APK
        working-directory: pokerogue-src/android
        run: |
          ./gradlew assembleDebug \
            --build-cache \
            --parallel \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Verify packaged APK icon
        working-directory: pokerogue-src/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          AAPT=$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name aapt \
              | sort -V \
              | tail -n 1
          )

          if [ -z "$AAPT" ]; then
            echo "::error::Could not locate aapt"
            exit 1
          fi

          echo "APK application icon resources:"
          "$AAPT" dump badging "$APK" \
            | grep -E "application(-icon|-label)?"

          if ! "$AAPT" dump resources "$APK" \
            | grep -q "silvershadow_launcher"; then
            echo "::error::SilverShadow launcher resource is missing from APK"
            exit 1
          fi

          echo "SilverShadow launcher resource is packaged in the APK."  

      - name: Rename resulting APK
        run: |
          SOURCE_APK="pokerogue-src/android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_NUM="${{ inputs.build_number || github.run_number }}"
          POKEROGUE_VERSION="${{ steps.pokerogue_version.outputs.version }}"
          SILVER_VERSION="${{ env.SILVERSHADOW_VERSION }}"

          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="PokeRogueSilverShadow-v${POKEROGUE_VERSION}-${SILVER_VERSION}-build${BUILD_NUM}-dev.apk"
          else
            OUTPUT="PokeRogueSilverShadow-v${POKEROGUE_VERSION}-${SILVER_VERSION}-build${BUILD_NUM}.apk"
          fi

          cp -v "$SOURCE_APK" "$OUTPUT"
          echo "APK_NAME=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload APK directly
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 30
