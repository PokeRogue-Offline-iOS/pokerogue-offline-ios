name: Build PokeRogueOffline Windows EXE

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (banner marker + -dev naming)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read shared SilverShadow version
        shell: bash
        run: |
          VERSION=$(node scripts/read-release-version.js)
          echo "SILVERSHADOW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SilverShadow version: $VERSION"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Clone PokeRogue fork
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} https://github.com/pagefaultgames/pokerogue.git pokerogue-src

      - name: Get PokeRogue version
        id: pokerogue_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./pokerogue-src/package.json').version")
          echo "POKEROGUE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PokeRogue version: $VERSION"

      - name: Download full unlocks save file
        shell: bash
        run: |
          curl -L https://raw.githubusercontent.com/pagefaultgames/pokerogue/beta/test/utils/saves/full_unlocks_sanitized.prsv \
            -o pokerogue-src/full_unlocks.prsv

      - name: Synchronize embedded Daily Run archive
        run: node scripts/sync-daily-seed-archive.mjs

      - name: Apply patches
        shell: bash
        run: bash scripts/apply-patches.sh exe

      - name: Inject shared version and build number into banner
        shell: bash
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          sed -i "s/SILVERSHADOW_VERSION_PLACEHOLDER/${SILVERSHADOW_VERSION}/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          if [ "${{ inputs.dev }}" = "true" ]; then
            sed -i "s/BUILD_NUMBER_PLACEHOLDER/${BUILD_NUM} DEV/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          else
            sed -i "s/BUILD_NUMBER_PLACEHOLDER/${BUILD_NUM}/g" pokerogue-src/src/ui/handlers/title-ui-handler.ts
          fi
          if grep -q "PLACEHOLDER" pokerogue-src/src/ui/handlers/title-ui-handler.ts; then
            echo "::error::An unresolved banner placeholder remains."
            exit 1
          fi

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Electron dependencies
        working-directory: pokerogue-src
        run: pnpm add -D electron@43.0.0 electron-builder@26.15.3

      - name: Install Capacitor plugin stub for shared code resolution
        working-directory: pokerogue-src
        shell: bash
        # See the identical step in build-appimage.yml — google-drive-backup.ts
        # dynamically imports @capgo/capacitor-social-login behind an
        # isCapacitor() check that's always false here, but Vite/Rolldown
        # still needs the package resolvable at build time.
        run: pnpm add @capacitor/core@8.4.1 @capgo/capacitor-social-login@8.3.33

      - name: Convert app icon to ICO
        shell: pwsh
        run: |
          $iconSource = if ('${{ inputs.dev }}' -eq 'true') {
            '${{ github.workspace }}/configs/android/icon-dev.png'
          } else {
            '${{ github.workspace }}/configs/android/icon-main.png'
          }
          magick $iconSource `
            -define icon:auto-resize=256,128,64,48,32,16 `
            ${{ github.workspace }}/appIcon.ico
          Write-Host "ICO created from $iconSource"

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build:app

      - name: Apply post-build patches
        shell: bash
        run: bash scripts/apply-post-build-patches.sh exe

      - name: Copy Electron config files into place
        shell: bash
        run: |
          cp configs/desktop/electron/main.cjs pokerogue-src/main.cjs
          cp configs/desktop/electron/preload.cjs pokerogue-src/preload.cjs
          cp configs/desktop/electron/electron-builder.windows.json pokerogue-src/electron-builder.json
          cp appIcon.ico pokerogue-src/appIcon.ico
          cp pokerogue-src/full_unlocks.prsv pokerogue-src/dist/full_unlocks.prsv

      - name: Inject Google OAuth credentials into main.cjs
        shell: bash
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_DESKTOP_CLIENT_ID" ] || [ -z "$GOOGLE_DESKTOP_CLIENT_SECRET" ]; then
            echo "::warning::Desktop Google OAuth credentials are missing; the app will build but Drive sign-in will report that OAuth is unavailable."
          else
            sed -i "s|GOOGLE_DESKTOP_CLIENT_ID_PLACEHOLDER|${GOOGLE_DESKTOP_CLIENT_ID}|g" pokerogue-src/main.cjs
            sed -i "s|GOOGLE_DESKTOP_CLIENT_SECRET_PLACEHOLDER|${GOOGLE_DESKTOP_CLIENT_SECRET}|g" pokerogue-src/main.cjs
          fi

      - name: Set electron main in package.json
        working-directory: pokerogue-src
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.description) pkg.description = 'PokeRogue Offline';
            if (!pkg.author) pkg.author = 'Scooom';
            pkg.main = 'main.cjs';
            pkg.version = process.env.SILVERSHADOW_VERSION;
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Generate Windows EXE
        working-directory: pokerogue-src
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ''
          WIN_CSC_LINK: ''
        run: pnpm electron-builder --win portable --config electron-builder.json --config.extraMetadata.version=$SILVERSHADOW_VERSION --config.buildVersion=${{ inputs.build_number || github.run_number }}

      - name: Rename and save EXE
        id: exe_path
        shell: bash
        run: |
          FILE=$(find -type f -name "PokeRogue*Offline*.exe" | head -n1)
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          BASE="PokeRogueSilverShadow-v${POKEROGUE_VERSION}-${SILVERSHADOW_VERSION}-build${BUILD_NUM}"
          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="./${BASE}-dev.exe"
          else
            OUTPUT="./${BASE}.exe"
          fi
          mv "$FILE" "$OUTPUT"
          echo "exe=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.exe_path.outputs.exe }}
          archive: false
          if-no-files-found: error
          retention-days: 30
