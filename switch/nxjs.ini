[v8]
; Expose an explicit full collection hook to the Switch-only diagnostics
; layer. It is called only at safe boundaries or when measured memory pressure
; crosses the documented thresholds, never once per frame.
flags = --expose-gc

[renderer]
; PokeRogue loads hundreds of textures during startup and continuously rotates
; encounter assets. The nx.js application-mode default permits a 512 MiB Skia
; GPU cache; cap it at 256 MiB so cached textures cannot consume that entire
; budget during long runs. This keeps GPU acceleration enabled.
gpu_cache = 256
